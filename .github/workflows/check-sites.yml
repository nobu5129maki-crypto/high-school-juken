# 自動更新データの週次点検
# 1. scripts/fetch-schools.mjs … 文部科学省「学校コード一覧」から全国の高校（校名・所在地・設置区分）を取得
# 2. scripts/check-sites.mjs   … 詳細データ校の公式サイトが到達できるか確認
# 生成ファイルが変わっていればコミットして push する。
# push により Vercel の Git 連携で自動デプロイされ、アプリ内の「最終自動確認」日付が更新される。
# 併せて VERCEL_DEPLOY_HOOK シークレットがあればデプロイフックも叩く（Git 連携が無い環境向けの保険）。
name: 自動更新データの週次点検

on:
  schedule:
    - cron: '0 21 * * 0' # 毎週月曜 6:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 文科省 学校コード一覧から全国の高校を取得
        run: node scripts/fetch-schools.mjs
      - name: 公式サイト到達確認
        run: node scripts/check-sites.mjs
      - name: 変更があればコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/site-check.json src/data/base-schools.json src/data/base-schools-meta.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "自動更新データを更新: 学校一覧・公式サイト到達確認 ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Vercel デプロイフック（任意）
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null
