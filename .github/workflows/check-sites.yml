# 公式サイトリンクの自動点検（毎週）
# scripts/check-sites.mjs を実行し、結果 (src/data/site-check.json) が変わっていればコミットして push する。
# push により Vercel の Git 連携があれば自動デプロイされ、アプリ内の「最終自動確認」日付が更新される。
# Git 連携が無い環境向けに、VERCEL_DEPLOY_HOOK シークレットがあればデプロイフックも叩く。
name: 公式サイト到達確認

on:
  schedule:
    - cron: '0 21 * * 0' # 毎週月曜 6:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 到達確認
        run: node scripts/check-sites.mjs
      - name: 変更があればコミット
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/site-check.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "公式サイト到達確認を自動更新 ($(date -u +%Y-%m-%d))"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Vercel デプロイフック（任意）
        if: steps.commit.outputs.changed == 'true' && env.HOOK != ''
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: curl -fsS -X POST "$HOOK" > /dev/null
